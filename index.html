<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Finder App</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Product Finder</h1>
        <div class="card mt-4 p-4">

            <input type="text" id="productId" class="form-control" placeholder="Enter Product Id">

            <br><br>

            <button class="btn btn-danger" onClick="searchProduct()">Search</button>

            <br>

            <h3 id="title"></h3>
            <p id="message" class="text-danger text-center"></p>
            <img id="image" width="200" class="m-auto mb-3">

            <p>Price: <span id="price"></span></p>
            <p>Category: <span id="category"></span></p>
            <p>Rating: <span id="rating"></span></p>
            <p>Description: <span id="description"></span></p>
            

        </div>

    </div>

    <script src="./script.js"></script>
    
</body>
</html>
